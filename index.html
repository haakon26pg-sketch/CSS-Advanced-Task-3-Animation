<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CSS Advanced | Task 3 Animation</title>
</head>
<body>


    <header>
        <h1 id="title">CSS Animation Playground</h1>
        <p>Exploring animations, transitions and transformations</p>
    </header>

    <main class="animaton-container">

        <div class="ball-container">
            <div class="ball"></div>
        </div>

        <button id="animated-button">
            Hover over me!
        </button>

        <a id="animated-link" href="https://www.youtube.com/watch?v=ZZ5LpwO-An4">
            Click me for a surprise!
        </a>

    <img
        id="animated-image"
        src="images/favicon.png"
        alt="Commander's Arsenal Logo"
    >

    </main>

    <footer>
        <p>Made with HTML & CSS</p>
    </footer>
    
</body>
</html>
